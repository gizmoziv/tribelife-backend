    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to
      // dark when the visitor hasn't chosen. Kept in sync with ThemeToggle.tsx
      // (same 'theme' key). Must stay inline + synchronous, before the app loads.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored ? stored === 'dark' : true;
          var root = document.documentElement;
          root.classList.add(dark ? 'dark' : 'light');
          root.classList.remove(dark ? 'light' : 'dark');
        } catch (e) {}
      })();
    </script>

        <h1>TribeLife: A Private, Vetted Network for Jewish Professionals</h1>
        <p>TribeLife is a private, members-only network for the Jewish community, built for professionals, founders, creators, students and community leaders. Membership is gated: you join with a referral from an existing member, or you apply and a member of our team reviews you before you're let in. Once inside, you create beacons for what you need, such as a Shabbat dinner host in a new city, a co-founder, a study partner or a job lead, and TribeLife matches you with people in the community who can actually help.</p>
        <h2>Key Features</h2>
        <ul>
          <li><strong>Vetted Membership</strong>: Every member joins by referral or passes review by our team. No open door, no bots.</li>
          <li><strong>Beacon Matching</strong>: Post what you need and get matched with relevant members using AI.</li>
          <li><strong>Local &amp; Global Rooms</strong>: Timezone-based community chats, plus a global room. Hebrew auto-translation included.</li>
          <li><strong>Built for Jewish Life</strong>: Shabbat dinners, chevruta partners, business deals, simchas, aliyah questions, and everything in between.</li>
          <li><strong>Private by Design</strong>: We never sell your data, and the member list isn't public.</li>
        </ul>
        <h2>How It Works</h2>
        <ol>
          <li>Download TribeLife on iOS or Android and get in with a member's referral, or by applying for review.</li>
          <li>Create a beacon describing what you need or offer.</li>
          <li>Get matched with the right people in the community.</li>
        </ol>
